<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>수학 시험지 도형 그리기</title>
<script>
window.mjReady=false;
window.MathJax={svg:{fontCache:'none'},startup:{typeset:false,ready(){MathJax.startup.defaultReady();MathJax.startup.promise.then(()=>{window.mjReady=true;if(window.onMathReady)window.onMathReady()})}}};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
:root{--bg:#f6f5f2;--panel:#fff;--line:#e3e1dc;--ink:#1f1f1f;--muted:#6b6b6b;--accent:#2f6fed;--accent-soft:#e8effd}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg)}
.app{display:grid;grid-template-columns:72px 1fr 280px;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
header{grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;margin:0 10px 0 0;font-weight:700;white-space:nowrap}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--ink);white-space:nowrap}
button:hover{background:#f3f3f1}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.primary:hover{background:#2560d6}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tools{background:var(--panel);border-right:1px solid var(--line);padding:8px 6px;display:flex;flex-direction:column;gap:3px;overflow:auto}
.tool{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;font-size:11px;border-radius:8px;border-color:transparent}
.tool svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.stage{position:relative;overflow:hidden;background:#fff}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.hint{position:absolute;left:12px;bottom:12px;background:rgba(31,31,31,.84);color:#fff;font-size:12.5px;padding:7px 11px;border-radius:8px;pointer-events:none;max-width:calc(100% - 24px);line-height:1.45}
.hint b{color:#ffd86b;font-weight:600}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:2px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.zoom button{border:0;padding:5px 9px;font-size:13px;min-width:30px}
#zoomPct{min-width:52px}
.side{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;overflow-x:hidden;padding:12px 12px 24px}
.side h2{font-size:12.5px;margin:16px 0 8px;color:var(--muted);font-weight:600}
.side h2:first-child{margin-top:2px}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.presets button{font-size:12px;padding:7px 4px}
.prop{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.prop>label{flex:0 0 66px;color:var(--muted);font-size:12px}
.prop input[type=text],.prop input[type=number]{flex:1;min-width:0;font:inherit;font-size:13px;padding:5px 7px;border:1px solid var(--line);border-radius:6px}
.prop input.err{border-color:#d33;background:#fff5f5}
.seg{display:flex;gap:3px;flex:1;flex-wrap:wrap;min-width:0}
.seg button{flex:1;padding:5px 2px;font-size:12px;min-width:30px}
.seg.nw button{flex:0 0 auto;padding:5px 8px}
.empty,.note{font-size:12.5px;color:var(--muted);line-height:1.55}
.note{margin:6px 0}
.danger{color:#c62828;width:100%;margin-top:12px}
#props>.pbox{border:1.5px solid var(--accent);background:#f7faff;border-radius:10px;padding:8px 10px 10px;margin-bottom:6px}
#props>.pbox h2{color:var(--accent);margin-top:2px}
.selbadge{position:absolute;left:12px;top:12px;background:var(--accent);color:#fff;font-size:12.5px;padding:5px 10px;border-radius:999px;pointer-events:none;display:none}
.toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:#1f1f1f;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:12px;padding:16px;max-width:min(720px,100%);max-height:100%;overflow:auto}
.modal img{max-width:100%;max-height:60vh;display:block;margin:10px auto;border:1px solid var(--line)}
.modal p{font-size:13px;color:var(--muted);margin:4px 0}
@media (max-width:820px){
 .app{grid-template-columns:60px 1fr;grid-template-rows:auto 1fr auto}
 .side{grid-column:1/-1;max-height:36vh;border-left:0;border-top:1px solid var(--line)}
 header h1{display:none}
}
</style>
</head>
<body>
<div class="app">
 <header>
  <h1>📐 시험지 도형 그리기</h1>
  <button id="bUndo" title="되돌리기 (Ctrl+Z)">↶ 되돌리기</button>
  <button id="bRedo" title="다시 하기 (Ctrl+Y)">↷</button>
  <button id="bDel" title="선택한 것 지우기 (Delete)">지우기</button>
  <button id="bClear">새로 그리기</button>
  <button id="bFiles">📁 내 그림</button>
  <span class="sep"></span>
  <button id="bGrid" class="on">모눈 보기</button>
  <button id="bSnap" class="on">모눈에 맞추기</button>
  <button id="bX" title="선과 선, 그래프끼리 만나는 점을 모두 표시">교점 보기</button>
  <button id="bView" title="편집용 표시를 숨기고 실제로 복사될 모습만 보기">미리보기</button>
  <button id="bTex" class="on" title="글자를 LaTeX 수식 글꼴로 표시">LaTeX 글꼴</button>
  <span class="sep"></span>
  <button id="bCopy" class="primary">이미지 복사</button>
  <button id="bPng">PNG 저장</button>
  <button id="bSvg">SVG 저장</button>
 </header>
 <nav class="tools" id="tools"></nav>
 <main class="stage" id="stage">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="hint" id="hint"></div>
  <div class="selbadge" id="selbadge"></div>
  <div class="zoom"><button id="zOut" title="축소 (Ctrl+휠)">−</button><button id="zoomPct" title="100%로">100%</button><button id="zIn" title="확대 (Ctrl+휠)">+</button><button id="zFit" title="그림 전체가 보이게">맞춤</button></div>
 </main>
 <aside class="side">
  <div id="props"></div>
  <h2>도형 바로 넣기</h2>
  <div class="presets" id="presets"></div>
  <div class="presets" id="rpolys" style="display:none;margin-top:5px;padding:6px;border:1px dashed var(--line);border-radius:8px"></div>
  <h2>입체도형</h2>
  <div class="prop"><label>밑면 모양</label><div class="seg" id="solidN"></div></div>
  <div class="presets" id="solids"></div>
  <div class="presets" id="regs" style="display:none;margin-top:5px;padding:6px;border:1px dashed var(--line);border-radius:8px"></div>
  <button id="setToggle" style="width:100%;margin-top:18px">⚙ 글자 크기·내보내기 설정 ▾</button>
  <div id="settings" style="display:none">
  <h2>글자 크기 (처음 값이 추천 크기)</h2>
  <div id="sizes"></div>
  <h2>한글·워드에 넣을 크기</h2>
  <div id="expbox"></div>
  <div class="prop" style="margin-top:8px"><label>이름 모양</label><div class="seg" id="lstyle"></div></div>
  </div>
 </aside>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="fmodal"><div class="box" style="width:min(640px,100%)">
 <div style="display:flex;align-items:center;gap:8px"><b style="font-size:15px">📁 내 그림</b><span class="spacer" style="flex:1"></span><button id="fClose">닫기</button></div>
 <p>지금 그림에 이름을 붙여 저장해 두고, 나중에 다시 열 수 있어요. 이 컴퓨터의 이 브라우저에 저장돼요.</p>
 <div style="display:flex;gap:6px;margin:10px 0"><input id="fName" type="text" placeholder="예: 2학기 기말 3번 원뿔대" style="flex:1;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:8px"><button id="fSave" class="primary">지금 그림 저장</button></div>
 <div id="fList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;max-height:46vh;overflow:auto"></div>
 <div style="border-top:1px solid var(--line);margin-top:12px;padding-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
  <span style="font-size:12.5px;color:var(--muted);flex:1;min-width:200px">다른 컴퓨터로 옮기거나 다른 선생님께 보낼 땐 <b>파일</b>로 저장하세요.</span>
  <button id="fExport">파일로 저장 (.json)</button><button id="fImport">파일 열기</button><input id="fInput" type="file" accept=".json,application/json" style="display:none">
 </div>
</div></div>
<div class="modal" id="modal"><div class="box">
 <b>그림 미리보기</b>
 <p>이 화면에서는 자동 저장·복사가 막혀 있어요. 아래 그림을 <b>마우스 오른쪽 버튼 → 이미지 복사/저장</b>(휴대폰은 길게 누르기) 하세요.</p>
 <img id="modalImg" alt="도형 미리보기">
 <div style="text-align:right"><button id="modalClose">닫기</button></div>
</div></div>

<script>
const NS='http://www.w3.org/2000/svg', PI=Math.PI, TAU=2*PI, GRID=20;
const $=s=>document.querySelector(s);
const f=n=>Math.round(n*100)/100;
const mod=(x,m)=>((x%m)+m)%m;
const normA=x=>{x=mod(x+PI,TAU)-PI;return x===-PI?PI:x};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const UNITS=new Set(['cm','mm','km','kg','mL','cm²','m²','cm³']);
const FONT="'Times New Roman','Noto Serif KR','Batang',serif";
const LW=1.6;

const svg=$('#svg'), stage=$('#stage');
let W=800,H=600;
let state={points:[],objs:[],nextId:1};
let tool='select', pending=[], sel=null, drag=null, mouse={x:-99,y:-99};
let showGrid=true, snap=true, preview=false;
let VX=0,VY=0,VS=1,pan=null,spaceDown=false;
let undoStack=[], redoStack=[], lastSaved='', softT=null;

/* ---------- 저장/되돌리기 ---------- */
const snapshot=()=>JSON.stringify(state);
function save(){try{localStorage.setItem('geo-draw-v1',snapshot())}catch(e){}}
function load(){try{const s=localStorage.getItem('geo-draw-v1');if(s){const o=JSON.parse(s);if(o&&Array.isArray(o.points))state=o}}catch(e){}lastSaved=snapshot()}
function pushUndo(){roundSync();autoLabels();const now=snapshot();if(now===lastSaved)return;undoStack.push(lastSaved);if(undoStack.length>200)undoStack.shift();redoStack.length=0;lastSaved=now;save();updBtns()}
function softCommit(){clearTimeout(softT);softT=setTimeout(pushUndo,450)}
function commit(){clearTimeout(softT);pushUndo();render();renderProps()}
function restore(s){state=JSON.parse(s);lastSaved=snapshot();sel=null;msel=[];pending=[];save();render();renderProps();updBtns();renderFS();renderLS()}
function undo(){clearTimeout(softT);pushUndo();if(!undoStack.length)return;redoStack.push(snapshot());const s=undoStack.pop();const r=redoStack.slice();restore(s);redoStack=r;updBtns()}
function redo(){if(!redoStack.length)return;undoStack.push(snapshot());const r=redoStack.slice();const s=r.pop();restore(s);redoStack=r;updBtns()}
function updBtns(){$('#bUndo').disabled=!undoStack.length;$('#bRedo').disabled=!redoStack.length}

/* ---------- 모델 ---------- */
const nid=()=>state.nextId++;
const P=id=>state.points.find(p=>p.id===id);
const O=id=>state.objs.find(o=>o.id===id);
const objsOf=t=>state.objs.filter(o=>o.type===t&&!o.ghost);
const LETTERS='ABCDEFGHIJKLMNPQRSTUVWXYZ';
function nextLabel(){const used=new Set(state.points.map(p=>p.label));for(const c of LETTERS)if(!used.has(c))return c;for(let i=1;;i++)for(const c of LETTERS){const l=c+"'".repeat(i);if(!used.has(l))return l}}
function makePoint(x,y,o={}){
 let label=o.label!==undefined?o.label:nextLabel();
 if(label==='O'&&state.points.some(p=>p.label==='O'))label=nextLabel();
 const p={id:nid(),x,y,label,dot:o.dot!==undefined?o.dot:true,lx:0,ly:-15,lman:false};
 state.points.push(p);return p.id;
}
function refs(o){switch(o.type){case'seg':return[o.a,o.b];case'poly':return o.pts;case'circle':return[o.c,o.p];case'arc':return[o.c,o.a,o.b];case'angle':return[o.a,o.v,o.b];case'round':return[o.c,...Object.values(o.anc||{})];case'dim':return[o.a,o.b];case'rev':return[o.c,...Object.values(o.anc||{})];case'solid3d':return[o.c,...Object.values(o.anc||{})];case'group':return o.pts;default:return[]}}

/* ---------- 입체도형 ---------- */
function ellD(x,y,rx,ry){return`M${f(x-rx)} ${f(y)}a${f(rx)} ${f(ry)} 0 1 0 ${f(2*rx)} 0a${f(rx)} ${f(ry)} 0 1 0 ${f(-2*rx)} 0`}
const frontD=(x,y,rx,ry)=>`M${f(x-rx)} ${f(y)}A${f(rx)} ${f(ry)} 0 0 0 ${f(x+rx)} ${f(y)}`;
const backD=(x,y,rx,ry)=>`M${f(x+rx)} ${f(y)}A${f(rx)} ${f(ry)} 0 0 0 ${f(x-rx)} ${f(y)}`;
function roundParts(o){
 const C=P(o.c),cx=C.x,cy=C.y,a=Math.max(4,+o.r||60),t=+o.tilt||.3,b=a*t,h=Math.max(0,+o.h||0);
 let S='',D='',T='';
 if(o.kind==='cylinder'){D+=backD(cx,cy,a,b);S+=frontD(cx,cy,a,b)+ellD(cx,cy-h,a,b)+`M${f(cx-a)} ${f(cy)}V${f(cy-h)}M${f(cx+a)} ${f(cy)}V${f(cy-h)}`}
 else if(o.kind==='frustum'){const a2=Math.max(2,+o.r2||a/2),b2=a2*t,apz=Math.abs(a-a2)>.5?h*a/(a-a2):null,t1=tangPt(a,0,apz,t),t2=tangPt(a2,h,apz,t);
  D+=backArc(cx,cy,a,b,t1);S+=frontArc(cx,cy,a,b,t1)+ellD(cx,cy-h,a2,b2)+`M${f(cx-t1.dx)} ${f(cy+t1.dy)}L${f(cx-t2.dx)} ${f(cy-h+t2.dy)}M${f(cx+t1.dx)} ${f(cy+t1.dy)}L${f(cx+t2.dx)} ${f(cy-h+t2.dy)}`;
  if(o.showApex&&a>a2+1){const H=h*a/(a-a2);D+=`M${f(cx-a2)} ${f(cy-h)}L${f(cx)} ${f(cy-H)}L${f(cx+a2)} ${f(cy-h)}`;if(o.showH)D+=`M${f(cx)} ${f(cy-h)}V${f(cy-H)}`}}
 else if(o.kind==='cone'){
  if(h>b+1){const yt=-b*b/h,xt=a*Math.sqrt(1-yt*yt/(b*b));
   S+=`M${f(cx-xt)} ${f(cy+yt)}A${f(a)} ${f(b)} 0 1 0 ${f(cx+xt)} ${f(cy+yt)}M${f(cx-xt)} ${f(cy+yt)}L${f(cx)} ${f(cy-h)}L${f(cx+xt)} ${f(cy+yt)}`;
   D+=`M${f(cx+xt)} ${f(cy+yt)}A${f(a)} ${f(b)} 0 0 0 ${f(cx-xt)} ${f(cy+yt)}`}
  else S+=ellD(cx,cy,a,b)}
 else{S+=circD(cx,cy,a)+frontD(cx,cy,a,b);D+=backD(cx,cy,a,b)}
 const F=[],Wh=[];{const a2=o.kind==='frustum'?Math.max(2,+o.r2||a/2):o.kind==='cone'?0:a;
  if(o.kind==='sphere')F.push(circD(cx,cy,a));else{F.push(ellD(cx,cy,a,b));F.push(`M${f(cx-a)} ${f(cy)}L${f(cx+a)} ${f(cy)}L${f(cx+a2)} ${f(cy-h)}L${f(cx-a2)} ${f(cy-h)}Z`);if(a2>0)F.push(ellD(cx,cy-h,a2,a2*t))}}
 if((o.kind==='cylinder'||o.kind==='frustum')&&+o.hole>0){const top=o.kind==='frustum'?Math.max(2,+o.r2||a/2):a,hr=Math.min(+o.hole,top-2);if(hr>0){const hb=hr*t;
  S+=ellD(cx,cy-h,hr,hb);Wh.push(ellD(cx,cy-h,hr,hb));D+=ellD(cx,cy,hr,hb)+`M${f(cx-hr)} ${f(cy-h)}V${f(cy)}M${f(cx+hr)} ${f(cy-h)}V${f(cy)}`}}
 if(o.showH&&o.kind!=='sphere'){D+=`M${f(cx)} ${f(cy)}V${f(cy-h)}`;if(o.hText)T+=tx(cx+6,cy-h/2,o.hText,{size:sz('tx'),anchor:'start'})}
 if(o.showR){const top=o.kind==='sphere';(top?(S+=`M${f(cx)} ${f(cy)}H${f(cx+a)}`):(D+=`M${f(cx)} ${f(cy)}H${f(cx+a)}`));if(o.rText)T+=tx(cx+a/2,cy-10,o.rText,{size:sz('tx')})}
 return{S,D,T,F,Wh,box:o.kind==='sphere'?{x0:cx-a,x1:cx+a,y0:cy-a,y1:cy+a}:{x0:cx-a,x1:cx+a,y0:cy-h-b,y1:cy+b}}}
function roundAnchorPos(o,key){const C=P(o.c),cx=C.x,cy=C.y,a=Math.max(4,+o.r||60),h=Math.max(0,+o.h||0),a2=o.kind==='frustum'?Math.max(2,+o.r2||a/2):a;
 if(key==='top')return{x:cx,y:cy-h};if(key==='rb')return{x:cx+a,y:cy};if(key==='rt')return{x:cx+a2,y:cy-h};
 if(key==='ht'||key==='hb'){const top=o.kind==='frustum'?a2:a,hr=Math.max(0,Math.min(+o.hole||0,top-2));return{x:cx+hr,y:key==='ht'?cy-h:cy}}
 if(key==='apex')return{x:cx,y:o.kind==='frustum'?(a>a2+1?cy-h*a/(a-a2):cy-h-40):cy-h};return{x:cx,y:cy}}
function revSync(){for(const o of objsOf('rev')){const C=P(o.c);if(!C)continue;const sc=+o.scale||1;
 if(!o.anc){o.anc={};const zs=new Set();o.prof.forEach((p,i)=>{if(p.r>=1){for(const[k,lx]of[['R'+i,12],['L'+i,-12]]){const id=makePoint(0,0,{label:'',dot:false});const q=P(id);q.lman=true;q.lx=lx;q.ly=0;o.anc[k]=id}}
  if(!zs.has(p.z)){zs.add(p.z);const id=makePoint(0,0,{label:'',dot:false});const q=P(id);q.lman=true;q.lx=-12;q.ly=-2;o.anc['M'+i]=id}})}
 for(const[k,id]of Object.entries(o.anc)){const p=P(id);if(!p)continue;const v=o.prof[+k.slice(1)];if(!v)continue;const sg=k[0]==='R'?1:k[0]==='L'?-1:0;p.x=C.x+sg*v.r*sc;p.y=C.y-v.z*sc}}}
function roundSync(){revSync();solidSync();for(const o of objsOf('round')){if(+o.hole>0&&o.anc&&!o.anc.ht)for(const k of['ht','hb']){const id=makePoint(0,0,{label:'',dot:false});const q=P(id);q.lman=true;q.lx=12;q.ly=k==='ht'?-8:8;o.anc[k]=id}}
 for(const o of objsOf('round'))for(const[k,id]of Object.entries(o.anc||{})){const p=P(id);if(!p)continue;const q=roundAnchorPos(o,k);p.x=q.x;p.y=q.y}}
function anchorOwner(pid){for(const o of [...objsOf('round'),...objsOf('rev'),...objsOf('solid3d')])for(const[k,id]of Object.entries(o.anc||{}))if(id===pid)return{o,k};return null}
function tangPt(r,z,apexZ,t){if(r<1)return{dx:0,dy:0};const b=r*t;if(apexZ==null)return{dx:r,dy:0};const d=apexZ-z;if(Math.abs(d)<=b+.5)return{dx:r,dy:0,inside:true};const yt=-b*b/d;return{dx:r*Math.sqrt(Math.max(0,1-yt*yt/(b*b))),dy:yt}}

function scaleStrokes(str,k){if(k===1)return str;return str.replace(/stroke-width="([\d.]+)"/g,(m,v)=>`stroke-width="${f(v*k)}"`).replace(/stroke-dasharray="([\d. ]+)"/g,(m,v)=>`stroke-dasharray="${v.trim().split(/\s+/).map(x=>f(x*k)).join(' ')}"`).replace(/ r="2\.7" fill="#111"/g,` r="${f(2.7*k)}" fill="#111"`)}
function exportSvgRaw(){
 const inner=scaleStrokes(drawScene(false),EXP.l);if(!state.points.length&&!state.objs.length)return null;
 const tmp=document.createElementNS(NS,'svg');tmp.setAttribute('width',W);tmp.setAttribute('height',H);tmp.style.cssText='position:absolute;left:-10000px;top:0;visibility:hidden';
 tmp.innerHTML=DEFS+'<g>'+inner+'</g>';document.body.append(tmp);let bb;try{bb=tmp.querySelector('g').getBBox()}finally{tmp.remove()}
 if(!bb||!bb.width)return null;const pad=12,x=Math.floor(bb.x-pad),y=Math.floor(bb.y-pad),w=Math.ceil(bb.width+2*pad),h=Math.ceil(bb.height+2*pad);
 return{w,h,str:`<svg xmlns="${NS}" width="${w}" height="${h}" viewBox="${x} ${y} ${w} ${h}"><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#fff"/>${DEFS}${inner}</svg>`}}
function crc32(buf){let c,crc=-1;for(let n=0;n<buf.length;n++){c=(crc^buf[n])&255;for(let k=0;k<8;k++)c=c&1?(c>>>1)^0xEDB88320:c>>>1;crc=(crc>>>8)^c}return(crc^-1)>>>0}
async function withDpi(blob,dpi){try{const a=new Uint8Array(await blob.arrayBuffer()),ppm=Math.round(dpi/0.0254),ch=new Uint8Array(21),dv=new DataView(ch.buffer);dv.setUint32(0,9);ch.set([112,72,89,115],4);dv.setUint32(8,ppm);dv.setUint32(12,ppm);ch[16]=1;dv.setUint32(17,crc32(ch.subarray(4,17)));
 const out=new Uint8Array(a.length+21);out.set(a.subarray(0,33),0);out.set(ch,33);out.set(a.subarray(33),54);return new Blob([out],{type:'image/png'})}catch(e){return blob}}
function pngBlob(scale=4){return new Promise((res,rej)=>{const e=exportSvg();if(!e)return rej('empty');const img=new Image();const fit=!!e.cmW;if(fit)scale=(e.cmW/2.54*300)/e.w;
 img.onload=()=>{const c=document.createElement('canvas');c.width=Math.round(e.w*scale);c.height=Math.round(e.h*scale);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?(fit?withDpi(b,300).then(res):res(b)):rej('blob'),'image/png')};
 img.onerror=()=>rej('img');img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(e.str)})}

function showTextModal(txt){let m=document.getElementById('tmodal');if(!m){m=document.createElement('div');m.id='tmodal';m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:99';

 document.body.append(m);m.addEventListener('click',e=>{if(e.target===m)m.style.display='none'});m.querySelector('.tclose').onclick=()=>m.style.display='none';
 m.querySelector('.tcopy').onclick=async()=>{const ta=m.querySelector('textarea');let ok=false;try{await navigator.clipboard.writeText(ta.value);ok=true}catch(_){try{ta.focus();ta.select();ok=document.execCommand('copy')}catch(__){}}toast(ok?'복사했어요. 붙여넣기(Ctrl+V) 하세요':'자동 복사가 안 돼요. 글상자를 눌러 전체 선택(Ctrl+A) 후 복사(Ctrl+C) 하세요')}}

function showPreview(blob){$('#modalImg').src=URL.createObjectURL(blob);$('#modal').classList.add('show')}
async function saveFile(name,data,blobForPreview){
 const d=await downloads();
 let why='';if(d){try{await d.save({filename:name,data});toast('저장했어요');return}catch(e){if(e&&e.code==='declined')return;why=e&&e.code||''}}else why='no-downloads';
 if(!window.claude){try{const b=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.append(a);a.click();a.remove();toast('저장했어요');return}catch(e){}}
 if(typeof data==='string'&&/\.json$/i.test(name)){showTextModal(data);return}
 if(blobForPreview)showPreview(blobForPreview);else toast('이 화면에서는 저장이 안 돼요'+(why?' ('+why+')':'')+'. PNG 저장이나 이미지 복사를 써 주세요.');
}

 catch(e){try{showPreview(await p)}catch(_){toast('복사하지 못했어요')}}};

const SAVE_KEY='geo-saves-v1';
function getSaves(){try{return JSON.parse(localStorage.getItem(SAVE_KEY)||'[]')}catch(e){return[]}}
function putSaves(a){try{localStorage.setItem(SAVE_KEY,JSON.stringify(a));return true}catch(e){toast('브라우저 저장 공간이 꽉 찼어요. 안 쓰는 그림을 지우거나 파일로 저장해 주세요');return false}}
function thumbOf(){const sv=state.expOn;state.expOn=false;let e=null;try{e=exportSvgRaw()}finally{state.expOn=sv}return e?e.str:''}
function loadDrawing(data){if(!data||!Array.isArray(data.points)||!Array.isArray(data.objs)){toast('그림 파일이 아니에요');return false}
 clearTimeout(softT);pushUndo();state=JSON.parse(JSON.stringify(data));sel=null;msel=[];pending=[];regionCache.clear();try{constrain();pruneRegions()}catch(_){}commit();renderFS();renderLS&&renderLS();setTimeout(zoomFit,0);return true}
function renderFiles(){const L=$('#fList');L.innerHTML='';const a=getSaves();
 if(!a.length){L.innerHTML='<div class="empty" style="grid-column:1/-1">아직 저장한 그림이 없어요.</div>';return}
 a.forEach((it,i)=>{const c=document.createElement('div');c.style.cssText='border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;background:#fff';
  const im=document.createElement('div');im.style.cssText='height:96px;display:flex;align-items:center;justify-content:center;background:#fafafa;border-radius:6px;overflow:hidden';if(it.thumb){const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(it.thumb);img.style.cssText='max-width:100%;max-height:96px';im.append(img)}
  const nm=document.createElement('div');nm.style.cssText='font-size:13px;font-weight:600;word-break:break-all';nm.textContent=it.name;const dt=document.createElement('div');dt.style.cssText='font-size:11.5px;color:var(--muted)';dt.textContent=new Date(it.t).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  const op=btn('열기',()=>{if(loadDrawing(it.data)){$('#fmodal').classList.remove('show');toast(`'${it.name}'을(를) 열었어요`)}},'primary'),ow=btn('덮어쓰기',()=>{const b=getSaves();b[i]={...b[i],data:JSON.parse(snapshot()),thumb:thumbOf(),t:Date.now()};if(putSaves(b)){renderFiles();toast('지금 그림으로 바꿔 저장했어요')}}),dl=btn('지우기',()=>{const b=getSaves();b.splice(i,1);putSaves(b);renderFiles()});dl.style.color='#c62828';
  [op,ow,dl].forEach(x=>{x.style.fontSize='12px';x.style.padding='5px 6px'});const row_=document.createElement('div');row_.style.cssText='display:flex;gap:4px';op.style.flex='1';row_.append(op,ow,dl);
  c.append(im,nm,dt,row_);L.append(c)})}

document.addEventListener('keydown',e=>{
 if(e.target.tagName==='INPUT')return;
 const k=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;
 if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
 if(mod&&k==='y'){e.preventDefault();redo();return}
 if(mod&&k==='c'&&selList().length){e.preventDefault();copySel();return}
 if(mod&&k==='v'&&CLIP){e.preventDefault();pasteClip();return}
 if(mod&&k==='d'&&selList().length){e.preventDefault();dupSel();return}
 if(k==='delete'||k==='backspace'){if(selList().length){e.preventDefault();deleteSel()}return}
 if(mod&&k==='a'&&tool==='select'){e.preventDefault();sel=null;msel=[...state.objs.map(o=>({kind:'obj',id:o.id})),...state.points.map(p=>({kind:'pt',id:p.id}))];if(msel.length===1){sel=msel[0];msel=[]}render();renderProps();return}
 if(k==='escape'){if(tool==='polygon'&&pending.length>=3){finishPolygon();return}if(tool!=='select'&&!pending.length){setTool('select');return}pending=[];if(tool==='select'){sel=null;msel=[];renderProps()}render();return}
 if(k==='enter'&&tool==='polygon'){finishPolygon();return}

  for(const q of M.pts){const p=P(q.id);if(p&&!p.on&&!anchorOwner(p.id)){p.x+=dx;p.y+=dy}else if(p&&anchorOwner(p.id)){const an=anchorOwner(p.id);if(M.pts.some(z=>z.id===an.o.c))continue}}
  for(const q of M.texts){const o=O(q.id);o.x+=dx;o.y+=dy}for(const q of M.axes){const o=O(q.id);o.ox+=dx;o.oy+=dy}constrain();softCommit();render();return}
});
